# ---- Data Parameters ----
window_length: 126
min_date: "2015-01-01"
smoke_days: 100
macros_weekly_path: "data/macros/combined_macros_weekly.csv"

# Optional explicit train/test split for out-of-sample evaluation.
# If unset (null), the full stream runs in train mode.
train_end_date: "2021-12-31"
test_start_date: "2022-01-01"
test_end_date: "2025-10-31"

# ---- Feature Columns (Daily) ----
feature_cols:
  - Open
  - High
  - Low
  - Close
  - Volume
  - SMA20
  - SMA50
  - RSI14
  - MACD
  - MACD_signal
  - MACD_hist
  - ADX
  - OBV
  - A_D
  - ATR
  - Boll_Bandwidth
  - combined_macros_ret
  - combined_macros_weekly_ret
  - Crude_Oil_WTI_Futures_Historical_Data_ret
  - India_VIX_Historical_Data_ret
  - NASDAQ_Composite_Historical_Data_ret
  - Nifty_50_Historical_Data_ret
  - S&P_500_Historical_Data_(1)_ret
  - USD_INR_Historical_Data_ret

# ---- Portfolio Constraints ----
top_k: 10
max_asset_weight: 0.20
min_trade_value: 1000.0
initial_nav: 1000.0

# ---- RL Training Hyperparameters ----
replay_capacity: 100000
batch_size: 32
gamma: 0.99
actor_lr: 0.0001
critic_lr: 0.001
checkpoint_every_steps: 500

# ---- Meta-Agent Config ----
meta_lr: 0.001
meta_hidden_dim: 128
meta_entropy_coef: 0.001
meta_baseline_momentum: 0.95
meta_warmup_steps: 250
meta_transition_steps: 50
meta_rho_min: 0.05
meta_rho_max: 0.30
meta_init_std_w: 0.35
meta_init_std_rho: 0.20

# ---- Graph Construction ----
graph:
  mode: "knn"            # identity | knn | corr_threshold
  k: 8
  corr_threshold: 0.60
  absolute_corr: true

# IMPORTANT: These column names MUST match 'combined_macros_weekly.csv' header
meta_input:
  macros:
    - NIFTY50_ret_last
    - NASDAQ_ret_last
    - SP500_ret_last
    - USDINR_ret_last
    - INDIAVIX_ret_last
    - CRUDE_ret_last
