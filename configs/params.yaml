# =============================
# Global Config for Training
# =============================

device: "cpu"

# ---- Universe (30 Stocks) ----
tickers:
  - NSE_ABB
  - NSE_ADANIPORTS
  - NSE_ADANIPOWER
  - NSE_AMBUJACEM
  - NSE_ASIANPAINT
  - NSE_BAJAJ_AUTO
  - NSE_BEL
  - NSE_BHARTIARTL
  - NSE_CIPLA
  - NSE_DLF
  - NSE_GODREJCP
  - NSE_HDFCBANK
  - NSE_HINDUNILVR
  - NSE_ICICIBANK
  - NSE_INDHOTEL
  - NSE_INFY
  - NSE_JSWSTEEL
  - NSE_KOTAKBANK
  - NSE_LT 
  - NSE_ONGC
  - NSE_PIDILITIND
  - NSE_RELIANCE
  - NSE_SBIN
  - NSE_SOLARINDS
  - NSE_SUNPHARMA
  - NSE_TATAPOWER
  - NSE_TCS
  - NSE_TITAN
  - NSE_TRENT
  - NSE_TVSMOTOR
  - NSE_ULTRACEMCO

# ---- Data Parameters ----
window_length: 126
min_date: "2015-01-01"
smoke_days: 100
macros_weekly_path: "data/macros/combined_macros_weekly.csv"

# ---- Feature Columns (Daily) ----
feature_cols:
  - Open
  - High
  - Low
  - Close
  - Volume
  - SMA20
  - SMA50
  - RSI14
  - MACD
  - MACD_signal
  - MACD_hist
  - ADX
  - OBV
  - A_D
  - ATR
  - Boll_MA
  - Boll_Upper
  - Boll_Lower
  - Boll_Bandwidth
  - Crude_Oil_WTI_Futures_Historical_Data_ret
  - India_VIX_Historical_Data_ret
  - NASDAQ_Composite_Historical_Data_ret
  - Nifty_50_Historical_Data_ret
  - S&P_500_Historical_Data_(1)_ret
  - USD_INR_Historical_Data_ret

# ---- Portfolio Constraints ----
top_k: 10
max_asset_weight: 0.20
min_trade_value: 1000.0
initial_nav: 1000.0

# ---- RL Training Hyperparameters ----
replay_capacity: 100000
batch_size: 32
gamma: 0.99
actor_lr: 0.0001
critic_lr: 0.001
checkpoint_every_steps: 500

# ---- Meta-Agent Config ----
meta_lr: 0.001

# IMPORTANT: These column names MUST match 'combined_macros_weekly.csv' header
meta_input:
  macros:
    - NIFTY50_ret_last
    - NASDAQ_ret_last
    - SP500_ret_last
    - USDINR_ret_last
    - INDIAVIX_ret_last
    - CRUDE_ret_last