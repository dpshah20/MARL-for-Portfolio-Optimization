# ---- Data Parameters ----
window_length: 126
min_date: "2015-01-01"
smoke_days: 100
macros_weekly_path: "data/macros/combined_macros_weekly.csv"

# Optional explicit train/test split for out-of-sample evaluation.
# If unset (null), the full stream runs in train mode.
train_end_date: "2021-06-30"
test_start_date: "2021-07-01"
test_end_date: "2026-04-30"

# ---- Feature Columns (Daily) ----
feature_cols:
  - Open
  - High
  - Low
  - Close
  - Volume
  - SMA20
  - SMA50
  - RSI14
  - MACD
  - MACD_signal
  - MACD_hist
  - ADX
  - OBV
  - A_D
  - ATR
  - Boll_Bandwidth
  - combined_macros_ret
  - combined_macros_weekly_ret
  - CRUDE_ret
  - INDIAVIX_ret
  - NASDAQ_ret
  - NIFTY50_ret
  - SP500_ret
  - USDINR_ret

# ---- Portfolio Constraints ----
top_k: 10
max_asset_weight: 0.30
min_trade_value: 1000.0
initial_nav: 1000.0
initial_cash: 10000000
commission_rate: 0.0
hysteresis_days: 3

# ---- RL Training Hyperparameters ----
replay_capacity: 100000
batch_size: 32
gamma: 0.99
actor_lr: 0.0001
critic_lr: 0.001
tau: 0.005
Nq: 51
checkpoint_every_steps: 500
checkpoint_dir: checkpoints

# ---- Reward Scaling ----
reward_scales:
  ret_scale: 0.01
  vol_scale: 0.02
  cvar_scale: 0.05
  mdd_scale: 0.10
  Rmax: 10.0

# ---- Graph Construction ----
graph:
  mode: knn
  k: 8
  corr_threshold: 0.60
  absolute_corr: true

# ---- Encoder Architecture ----
encoder:
  d_time: 64
  d_gnn: 64
  time_layers: 2
  gnn_layers: 2

# ---- Agent Architecture ----
actor_hidden: 128
actor_mem_dim: 64
critic_hidden: 512

# ---- Meta-Agent Config ----
meta_lr: 0.001
meta_hidden_dim: 128
meta_entropy_coef: 0.001
meta_baseline_momentum: 0.95
meta_warmup_steps: 50
meta_transition_steps: 50
meta_learn_in_test: true
meta_rho_min: 0.05
meta_rho_max: 0.30
meta_init_std_w: 0.35
meta_init_std_rho: 0.20
